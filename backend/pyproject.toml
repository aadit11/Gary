[project]
name = "gary-backend"
version = "0.1.0"
description = "FastAPI backend: Twilio webhooks, Twilio<->Deepgram voice bridge, MCP servers, SMS webhook, scheduler."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "mcp>=1.12,<2",
    "httpx",
    "websockets",
    "twilio",
    "supabase",
    "apscheduler",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "agisdk>=0.3.5",
    "jev-ultrafast",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
jev-ultrafast = { git = "https://github.com/browser-use/jev-ultrafast.git" }
